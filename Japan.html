<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本への感情</title>
  <link rel="stylesheet" href="./index.css">
  <script type="module" src="./comment.js"></script>
  <style>
    :root {
      --primary-color: #3b82f6;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }

    h2 {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-top: 0;
    }

    .chart-container {
      position: relative;
      width: 100%;
      margin: 20px 0 30px;
      text-align: center;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .chart-container iframe {
      width: 100%;
      max-width: 600px;
      height: 371px;
      border: none;
    }

    /* コメントセクション */
    .comment-section {
      margin-top: 30px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .form-group textarea { height: 80px; resize: vertical; }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* 管理者ログインバー */
    .admin-bar {
      margin-top: 30px;
      padding: 15px;
      background-color: #f1f5f9;
      border-radius: 8px;
    }
    .admin-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .admin-inputs input {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .comment-list { margin-top: 20px; }
    .comment-item {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 6px;
    }
    .comment-author { font-weight: bold; color: var(--text-color); }
    .comment-body { white-space: pre-wrap; word-break: break-all; }
    
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }
    .admin-logged-in .delete-btn { display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <a href="./asia.html" class="back-link">← アジアトップへ戻る</a>
  <h2>日本への感情</h2>

  <!-- グラフ表示 -->
  <div class="chart-container">
    <iframe seamless frameborder="0" scrolling="no" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYt0KbKPTzjec_haoso0v7BOY2Vn4Mu3JP-zGQf7C47X5UeL_zpOkx1DZvQppa2g8RzOpUKLuF4yhA/pubchart?oid=2139295306&amp;format=interactive"></iframe>
  </div>

  <!-- コメントエリア -->
  <div class="comment-section">
    <h3>コメントを投稿する</h3>
    <form id="commentForm">
      <div class="form-group">
        <input type="text" id="authorInput" placeholder="お名前（任意）">
      </div>
      <div class="form-group">
        <textarea id="contentInput" placeholder="コメントを入力してください" required></textarea>
      </div>
      <button type="submit" class="btn">投稿する</button>
    </form>

    <div class="comment-list" id="commentList">
      <p style="color:#94a3b8;">読み込み中...</p>
    </div>

    <!-- 管理者エリア -->
    <div class="admin-bar">
      <span style="font-size:0.85rem; font-weight:bold;">管理者モード</span>
      <div id="adminLoginForm" class="admin-inputs">
        <input type="email" id="adminEmail" placeholder="メールアドレス">
        <input type="password" id="adminPass" placeholder="パスワード">
        <button type="button" class="btn" style="padding: 6px 12px; font-size: 0.85rem;" id="adminLoginBtn">ログイン</button>
      </div>
      <div id="adminStatus" style="font-size: 0.85rem; color: #10b981; font-weight: bold; margin-top: 5px;"></div>
    </div>
  </div>
</div>

</body>
</html>
